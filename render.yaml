# Render Blueprint for the Phase 2 static website.
# Import this file in Render as a Blueprint, or mirror these settings
# when creating a Static Site manually.
services:
  - type: web
    name: gospel-of-peace-community
    runtime: static
    branch: phase-2-functional-website
    buildCommand: echo "Static HTML site - no build step required"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
